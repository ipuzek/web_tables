name: Build site

on:
  push:
    branches: [ main ]

  schedule:
    - cron: "0 6 * * *"   # 07:00 CET / 08:00 CEST

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - run: uv sync

      - name: Test OSS access
        run: |
          uv run python - <<'PY'
          import urllib.request

          url = "https://oss.uredjenazemlja.hr/oss/public/search-cad-parcels/offices"

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json, text/plain, */*",
          }

          with urllib.request.urlopen("https://api.ipify.org", timeout=20) as r:
              ip = r.read().decode()

          req = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  status = r.status
                  body = r.read(500).decode(errors="replace")
          except urllib.error.HTTPError as e:
              status = e.code
              body = e.read(500).decode(errors="replace")

          print("Egress IP:", ip)
          print("OSS status:", status)
          print("OSS body:", body)
          PY

      - run: uv run python build.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
